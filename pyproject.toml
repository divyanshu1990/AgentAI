[project]
name = "agentai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "divyanshu1990", email = "divyanshujha88@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "arxiv==1.4.8",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.3.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
agentai = "agentai:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
